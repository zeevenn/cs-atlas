<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
  <title id="title">左连接中 ON 与 WHERE 的薪资筛选差异</title>
  <desc id="desc">薪资条件放在 ON 时，仅匹配林晨，运营部和财务部仍保留，员工列补 NULL，共三行。薪资条件放在 WHERE 时，先按部门连接产生四行，再过滤薪资不足及 NULL 的行，只剩研发部和林晨。</desc>
  <defs>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#216a78" />
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#946017" />
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="490" rx="9" fill="#fff" stroke="none" />
  <g transform="translate(0 -86)">
    <rect x="24" y="102" width="712" height="200" rx="9" fill="#f5f9f9" stroke="none" />
    <text x="40" y="134" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#18333b" text-anchor="start">ON e.salary &gt;= 10000</text>
    <text x="40" y="168" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#60737a" text-anchor="start">匹配</text>
    <text x="430" y="168" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#60737a" text-anchor="start">结果</text>
    <text x="48" y="203" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">研发部</text>
    <text x="164" y="203" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">林晨</text>
    <rect x="420" y="180" width="296" height="31" rx="9" fill="#e3f0f0" stroke="none" />
    <text x="432" y="203" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">研发部</text>
    <text x="564" y="203" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">林晨</text>
    <text x="48" y="239" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">运营部</text>
    <text x="164" y="239" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#60737a" text-anchor="start">—</text>
    <rect x="420" y="216" width="296" height="31" rx="9" fill="#fff0ce" stroke="none" />
    <text x="432" y="239" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">运营部</text>
    <text x="564" y="239" font-family="SFMono-Regular,Consolas,monospace" font-size="19" font-weight="400" fill="#946017" text-anchor="start">NULL</text>
    <text x="48" y="275" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">财务部</text>
    <text x="164" y="275" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#60737a" text-anchor="start">—</text>
    <rect x="420" y="252" width="296" height="31" rx="9" fill="#fff0ce" stroke="none" />
    <text x="432" y="275" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">财务部</text>
    <text x="564" y="275" font-family="SFMono-Regular,Consolas,monospace" font-size="19" font-weight="400" fill="#946017" text-anchor="start">NULL</text>
    <path d="M 306 231 C 370 231, 346 231, 410 231" fill="none" stroke="#216a78" stroke-width="2.5" marker-end="url(#teal)" />
    <rect x="24" y="322" width="712" height="238" rx="9" fill="#f5f9f9" stroke="none" />
    <text x="40" y="354" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="600" fill="#18333b" text-anchor="start">WHERE e.salary &gt;= 10000</text>
    <text x="40" y="388" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#60737a" text-anchor="start">连接</text>
    <text x="430" y="388" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#60737a" text-anchor="start">结果</text>
    <rect x="40" y="400" width="292" height="31" rx="9" fill="#e3f0f0" stroke="none" />
    <text x="48" y="423" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#18333b" text-anchor="start">研发部</text>
    <text x="142" y="423" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#18333b" text-anchor="start">林晨</text>
    <text x="312" y="423" font-family="SFMono-Regular,Consolas,monospace" font-size="17" font-weight="400" fill="#18333b" text-anchor="end">12000</text>
    <rect x="40" y="436" width="292" height="31" rx="9" fill="#f0f2f3" stroke="none" />
    <text x="48" y="459" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#18333b" text-anchor="start">研发部</text>
    <text x="142" y="459" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#60737a" text-anchor="start">周宁</text>
    <text x="312" y="459" font-family="SFMono-Regular,Consolas,monospace" font-size="17" font-weight="400" fill="#60737a" text-anchor="end">9000</text>
    <rect x="40" y="472" width="292" height="31" rx="9" fill="#f0f2f3" stroke="none" />
    <text x="48" y="495" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#18333b" text-anchor="start">运营部</text>
    <text x="142" y="495" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#60737a" text-anchor="start">陈雨</text>
    <text x="312" y="495" font-family="SFMono-Regular,Consolas,monospace" font-size="17" font-weight="400" fill="#60737a" text-anchor="end">8000</text>
    <rect x="40" y="508" width="292" height="31" rx="9" fill="#f0f2f3" stroke="none" />
    <text x="48" y="531" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#18333b" text-anchor="start">财务部</text>
    <text x="142" y="531" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#60737a" text-anchor="start">NULL</text>
    <text x="312" y="531" font-family="SFMono-Regular,Consolas,monospace" font-size="17" font-weight="400" fill="#60737a" text-anchor="end">NULL</text>
    <path d="M 340 450 C 404 450, 346 450, 410 450" fill="none" stroke="#216a78" stroke-width="2.5" marker-end="url(#teal)" />
    <rect x="420" y="400" width="296" height="31" rx="9" fill="#e3f0f0" stroke="none" />
    <text x="432" y="423" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">研发部</text>
    <text x="564" y="423" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#18333b" text-anchor="start">林晨</text>
  </g>
</svg>
