    <rect x="484" y="282" width="244" height="42" rx="9" fill="#f0f2f3" stroke="none" />
    <text x="512" y="310" font-family="SFMono-Regular,Consolas,monospace" font-size="19" font-weight="400" fill="#60737a" text-anchor="start">3</text>
    <text x="568" y="310" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#60737a" text-anchor="start">财务部</text>
    <path d="M 320 195 C 384 195, 416 195, 480 195" fill="none" stroke="#216a78" stroke-width="2.5" marker-end="url(#teal)" />
    <path d="M 320 249 C 384 249, 416 195, 480 195" fill="none" stroke="#216a78" stroke-width="2.5" marker-end="url(#teal)" />
    <path d="M 320 303 C 384 303, 416 249, 480 249" fill="none" stroke="#216a78" stroke-width="2.5" marker-end="url(#teal)" />
    <rect x="468" y="334" width="260" height="48" rx="9" fill="#fff4dc" stroke="#cfad6b" stroke-dasharray="6 5" />
    <text x="598" y="365" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#946017" text-anchor="middle">NULL</text>
    <path d="M 320 357 C 384 357, 400 357, 464 357" fill="none" stroke="#946017" stroke-width="2.5" marker-end="url(#amber)" stroke-dasharray="6 5" />
  </g>
</svg>
